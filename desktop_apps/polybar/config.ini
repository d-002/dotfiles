[bar/mybar]
modules-left = workspaces
modules-right = cpu memory disk clock tray
bottom = true
font-0 = FiraCode Nerd Font:size=11
separator = |
separator-padding = 4px
background = #222222
foreground = #CCCCCC

[module/workspaces]
type = internal/xworkspaces
label-active = %name%
label-active-padding = 5px
label-active-background = #64727D

label-occupied = %name%
label-occupied-padding = 5px
label-occupied-background = #333333

label-urgent = %name%
label-urgent-padding = 5px
label-urgent-background = #EB4D4B

[module/cpu]
type = internal/cpu
format = "<label>  "
padding = 4px
format-foreground = #2ECC71
interval = 5

[module/memory]
type = internal/memory
format = "<label>  "
format-warn = "!! <label-warn>  "
label = "%used%"
label-warn = "%used%"
format-foreground = #9B59B6
format-warn-foreground = #FFFFFF
format-warn-background = #F53C3C
warn-percentage = 50
interval = 5

[module/disk]
type = internal/fs
label-mounted = "%used% / %total% %percentage_used%%  "
label-mounted-foreground = #61A2FF
interval = 5

[module/clock]
type = internal/date
date = "%d %H:%M:%S  "
format-foreground = #F3C046
interval = 1

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 10px
tray-padding = 10px
